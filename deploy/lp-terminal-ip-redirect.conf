# Preserve a convenient IP entry point without attempting TLS for an IP address.
# The certificate is valid for newlp.coinfetcher.xyz, so every unknown HTTP host
# (including 43.134.42.2) is canonicalized to the HTTPS hostname.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://newlp.coinfetcher.xyz$request_uri;
}
