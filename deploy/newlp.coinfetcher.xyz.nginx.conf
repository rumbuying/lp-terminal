# Canonical dual-chain gateway for newlp.coinfetcher.xyz.
server {
    server_name newlp.coinfetcher.xyz 43.134.42.2;

    root /var/www/lp-terminal/current;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Pool scans batch large multicalls through the same-origin RPC routes;
    # without this the nginx default 1m body limit answered 413 and the scan
    # fell back to the browser-direct public RPC (seen live 2026-09-01).
    client_max_body_size 20m;

    location = /healthz {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # Legacy, build-chain compatibility routes remain Robinhood-bound.
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8787;
        include /etc/nginx/proxy_params;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location ^~ /executor/ {
        proxy_pass http://127.0.0.1:8790/;
        include /etc/nginx/proxy_params;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location = /rpc {
        proxy_pass https://rpc.mainnet.chain.robinhood.com/;
        proxy_http_version 1.1;
        proxy_set_header Host rpc.mainnet.chain.robinhood.com;
        proxy_ssl_server_name on;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Canonical chain-scoped indexers.
    location ^~ /_chain/robinhood/api/ {
        proxy_pass http://127.0.0.1:8787/api/;
        include /etc/nginx/proxy_params;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location ^~ /_chain/bsc/api/ {
        proxy_pass http://127.0.0.1:8788/api/;
        include /etc/nginx/proxy_params;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Canonical chain-scoped executors. Prefix stripping is deliberate: each
    # loopback service exposes /health and /v1/* at its own root.
    location ^~ /_chain/robinhood/executor/ {
        proxy_pass http://127.0.0.1:8790/;
        include /etc/nginx/proxy_params;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location ^~ /_chain/bsc/executor/ {
        proxy_pass http://127.0.0.1:8791/;
        include /etc/nginx/proxy_params;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Browser-facing RPCs are public endpoints. Private provider credentials
    # stay in the root-owned service environment files.
    location = /_chain/robinhood/rpc {
        proxy_pass https://rpc.mainnet.chain.robinhood.com/;
        proxy_http_version 1.1;
        proxy_set_header Host rpc.mainnet.chain.robinhood.com;
        proxy_ssl_server_name on;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        # Shared visitor egress IP gets 429-limited by the public RPC under
        # scan load; fail over to the private Alchemy endpoint instead of
        # pushing every client into the browser-direct fallback. viem's default
        # batchSize (1,000) matches what Alchemy accepts. The key stays in
        # /etc/nginx/secrets/, never in this file. (2026-09-01)
        proxy_intercept_errors on;
        error_page 429 502 504 = @robinhood_rpc_backup;
    }

    # Named (not externally addressable). The include holds a VARIABLE
    # proxy_pass because static proxy_pass with a URI is illegal in named
    # locations; the resolver is required for request-time resolution, and
    # ipv6=off because this host has no IPv6 route.
    location @robinhood_rpc_backup {
        include /etc/nginx/secrets/lp-robinhood-alchemy.conf;
        resolver 8.8.8.8 1.1.1.1 valid=300s ipv6=off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location = /_chain/bsc/rpc {
        proxy_pass https://bsc-dataseed.bnbchain.org/;
        proxy_http_version 1.1;
        proxy_set_header Host bsc-dataseed.bnbchain.org;
        proxy_ssl_server_name on;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Robinhood's bridge counterparties. These are public fallbacks and only
    # exist under the Robinhood namespace; BSC does not expose the bridge UI.
    location = /_chain/robinhood/rpc/eth {
        proxy_pass https://ethereum-rpc.publicnode.com/;
        proxy_http_version 1.1;
        proxy_set_header Host ethereum-rpc.publicnode.com;
        proxy_ssl_server_name on;
    }
    location = /_chain/robinhood/rpc/arb {
        proxy_pass https://arb1.arbitrum.io/rpc;
        proxy_http_version 1.1;
        proxy_set_header Host arb1.arbitrum.io;
        proxy_ssl_server_name on;
    }
    location = /_chain/robinhood/rpc/base {
        proxy_pass https://mainnet.base.org/;
        proxy_http_version 1.1;
        proxy_set_header Host mainnet.base.org;
        proxy_ssl_server_name on;
    }
    location = /_chain/robinhood/rpc/op {
        proxy_pass https://mainnet.optimism.io/;
        proxy_http_version 1.1;
        proxy_set_header Host mainnet.optimism.io;
        proxy_ssl_server_name on;
    }

    # Refuse unknown chains and misspelled scoped routes.
    location ^~ /_chain/ {
        return 404;
    }

    location ^~ /kyber/ {
        proxy_pass https://aggregator-api.kyberswap.com/;
        proxy_http_version 1.1;
        proxy_set_header Host aggregator-api.kyberswap.com;
        proxy_ssl_server_name on;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location ^~ /dexscreener/ {
        proxy_pass https://api.dexscreener.com/;
        proxy_http_version 1.1;
        proxy_set_header Host api.dexscreener.com;
        proxy_ssl_server_name on;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location ^~ /goldsky/ {
        proxy_pass https://api.goldsky.com/;
        proxy_http_version 1.1;
        proxy_set_header Host api.goldsky.com;
        proxy_ssl_server_name on;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # The Graph credential is injected from a root-only include generated at
    # deploy time; it is never present in this file or the frontend bundle.
    location ^~ /thegraph/ {
        proxy_pass https://gateway.thegraph.com/;
        proxy_http_version 1.1;
        proxy_set_header Host gateway.thegraph.com;
        proxy_ssl_server_name on;
        include /etc/nginx/secrets/lp-thegraph.conf;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location ~* ^/assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/newlp.coinfetcher.xyz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/newlp.coinfetcher.xyz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    listen 80;
    listen [::]:80;
    server_name newlp.coinfetcher.xyz 43.134.42.2;
    return 301 https://newlp.coinfetcher.xyz$request_uri;
}
