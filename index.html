<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <!-- The LP wordmark, same one as the badge in ProtoBadge and wallet-icon.png,
         but redrawn on a 16-unit grid: at tab size every bar has to land on a
         whole pixel or the P's counter fills in and it reads as a blob. -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%230a0e0b'/><rect x='0' y='3' width='2' height='10' fill='%234af626'/><rect x='0' y='11' width='4' height='2' fill='%234af626'/><rect x='6' y='3' width='2' height='10' fill='%234af626'/><rect x='6' y='3' width='6' height='2' fill='%234af626'/><rect x='10' y='3' width='2' height='6' fill='%234af626'/><rect x='6' y='7' width='6' height='2' fill='%234af626'/><rect x='14' y='6' width='2' height='7' fill='%234af626'/></svg>"
    />
    <title>LP TERMINAL</title>
    <script>
      // apply the saved theme before first paint (no flash). ?theme= is a
      // view-only override (screenshots/sharing) — it is not persisted.
      try {
        var m = location.search.match(/[?&]theme=(\w+)/)
        var t = (m && m[1]) || localStorage.getItem('up33.theme.v1')
        if (/^(mono|phosphor|amber|ice|violet)$/.test(t)) document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
